<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebTalker - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const username = localStorage.getItem("username");
      const token = localStorage.getItem("token");

      if (username && token) {
        // Usuário já logado, redireciona para main.html
        window.location.href = "main.html";
      }
    });
  </script>

  <main class="login-container">
    <h1>WebTalker</h1>

    <label for="usernameInput" class="visually-hidden">Nome de usuário</label>
    <input type="text" id="usernameInput" placeholder="Digite seu nome de usuário" autocomplete="off" required />

    <div class="login-buttons">
      <button id="loginBtn">Entrar</button>
      <button id="registerBtn">Cadastrar</button>
    </div>

    <p id="errorMsg" role="alert" aria-live="polite" style="color: red;"></p>
  </main>

  <script src="login.js"></script>
</body>
</html>
